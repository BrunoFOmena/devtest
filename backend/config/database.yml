# PostgreSQL. Versions 9.5 and up are supported.
#
# Credenciais locais: config/database.local.yml (gitignored). Postgres via Docker Compose na raiz.
<% local_path = Rails.root.join("config/database.local.yml") %> <%# caminho do arquivo local %>
<% local_cfg = File.exist?(local_path) ? (YAML.load_file(local_path)[Rails.env] || {}) : {} %> <%# le credenciais do ambiente atual %>

default: &default #bloco padrao reutilizado pelos ambientes
  adapter: postgresql #usa PostgreSQL
  encoding: unicode #encoding unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %> #pool de conexoes


development: #banco do dia a dia
  <<: *default #herda o bloco default
  database: backend_development #nome do banco
  host: <%= local_cfg["host"] || "127.0.0.1" %> #host do .local ou padrao
  username: <%= local_cfg["username"] || "postgres" %> #usuario do .local ou padrao
  password: <%= local_cfg["password"] %> #senha do .local
  port: <%= local_cfg["port"] || 5432 %> #porta do .local ou 5432
  sslmode: disable #sem SSL em local

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test: #banco dos testes (descartavel)
  <<: *default
  database: backend_test
  host: <%= local_cfg["host"] || "127.0.0.1" %>
  username: <%= local_cfg["username"] || "postgres" %>
  password: <%= local_cfg["password"] %>
  port: <%= local_cfg["port"] || 5432 %>
  sslmode: disable

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code.
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
production: #config de producao (deploy)
  primary: &primary_production #banco principal
    <<: *default
    database: backend_production
    username: backend
    password: <%= ENV["BACKEND_DATABASE_PASSWORD"] %> #senha via ENV
  cache: #banco do cache (Solid Cache)
    <<: *primary_production
    database: backend_production_cache
    migrations_paths: db/cache_migrate
  queue: #banco das filas (Solid Queue)
    <<: *primary_production
    database: backend_production_queue
    migrations_paths: db/queue_migrate
  cable: #banco do Action Cable
    <<: *primary_production
    database: backend_production_cable
    migrations_paths: db/cable_migrate
